# Netlify détecte Next.js et installe son adaptateur automatiquement.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# www.soumayaboutique.com renvoie vers le domaine principal. Pas de redirection depuis
# soumayaboutique.netlify.app tant que le certificat HTTPS du domaine n'est pas actif.
[[redirects]]
  from = "https://www.soumayaboutique.com/*"
  to = "https://soumayaboutique.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
