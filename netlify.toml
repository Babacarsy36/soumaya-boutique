# Netlify détecte Next.js et installe son adaptateur automatiquement.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# www et l'adresse netlify.app renvoient vers le domaine principal.
[[redirects]]
  from = "https://www.soumayaboutique.com/*"
  to = "https://soumayaboutique.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://soumayaboutique.netlify.app/*"
  to = "https://soumayaboutique.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
